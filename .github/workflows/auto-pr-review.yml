name: Auto PR Review
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run only code from the trusted default branch, never PR code or artifacts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const review = require('./tools/pr-review.cjs');
            await review.run({github, context, core});
