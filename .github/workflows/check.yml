name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo test --manifest-path native/Cargo.toml --locked
      - run: python -m unittest discover -s tests -v
      - run: python tools/release.py --check
      - run: node --test tests/*.cjs
      - run: sh -n install.sh && sh -n native/build.sh
      - run: php -l gateway.php
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native FreeBSD build and fixtures
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.5'
          prepare: pkg install -y rust python311
          run: |
            set -eu
            sh native/build.sh
            python3.11 native/tests/lifecycle.py native/target/release/helios-container-native
            python3.11 native/tests/gateway.py native/target/release/helios-container-native
            python3.11 -m unittest discover -s tests -v
            python3.11 tools/release.py --binary native/target/release/helios-container-native
            python3.11 tools/release.py --verify
      - uses: actions/upload-artifact@v7
        with:
          name: release-preview
          path: dist/
          if-no-files-found: error
