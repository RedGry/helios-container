name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  code-quality:
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.quality.result }}" = success
  quality:
    uses: ./.github/workflows/quality.yml
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_release.py -v
      - run: python tools/release.py --check
      - run: node --test tests/*.cjs
      - run: sh -n install.sh && sh -n native/build.sh
  release-check:
    needs: [quality, scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Native FreeBSD build and fixtures
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.5'
          prepare: pkg install -y rust python311
          run: |
            set -eu
            sh native/build.sh
            python3.11 native/tests/lifecycle.py native/target/release/helios-container-native
            python3.11 native/tests/gateway.py native/target/release/helios-container-native
            python3.11 native/tests/update.py native/target/release/helios-container-native
            python3.11 -m unittest discover -s tests -p test_release.py -v
            python3.11 tools/release.py --binary native/target/release/helios-container-native
            python3.11 tools/release.py --verify
      - uses: actions/upload-artifact@v7
        with:
          name: release-preview
          path: dist/
          if-no-files-found: error
