name: Code Quality
on:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.99.0 fmt --manifest-path native/Cargo.toml --all --check
      - run: cargo +1.99.0 clippy --manifest-path native/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.99.0 test --manifest-path native/Cargo.toml --all-targets --all-features --locked
      - run: rustup default 1.99.0
      - run: python3 tools/test_quality.py --rust
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check
      - run: python3 -m unittest discover -s tests -p test_php_gateway.py -v
      - run: python3 tools/test_quality.py --php
